name: DSH Plugin Compatibility

on:
  pull_request:
    branches:
      - test
    paths:
      - ".github/workflows/dsh-compat.yml"
      - "packages/core/**"
      - "packages/dsh/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - current
          - legacy-0.1.0-rc.6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Install legacy DSH host packages
        if: matrix.runtime == 'legacy-0.1.0-rc.6'
        shell: bash
        run: |
          set -euo pipefail
          legacy_runtime="${RUNNER_TEMP}/dsh-legacy-runtime"
          npm install \
            --prefix "${legacy_runtime}" \
            --no-save \
            --package-lock=false \
            --ignore-scripts \
            @deepseek-ai/cordis@4.0.1 \
            @deepseek-ai/cordis-plugin-include@1.0.6 \
            @deepseek-ai/cordis-plugin-loader@1.0.2 \
            @deepseek-ai/schemastery@3.18.1 \
            @deepseek-ai/dsh-agent@0.1.0-rc.6 \
            @deepseek-ai/dsh-attachment@0.1.0-rc.6 \
            @deepseek-ai/dsh-brand@0.1.0-rc.6 \
            @deepseek-ai/dsh-credentials@0.1.0-rc.6 \
            @deepseek-ai/dsh-invariants@0.1.0-rc.6 \
            @deepseek-ai/dsh-launch-environment@0.1.0-rc.6 \
            @deepseek-ai/dsh-llm@0.1.0-rc.6 \
            @deepseek-ai/dsh-scope@0.1.0-rc.6 \
            @deepseek-ai/dsh-session@0.1.0-rc.6 \
            @deepseek-ai/dsh-settings@0.1.0-rc.6 \
            @deepseek-ai/dsh-system-prompt@0.1.0-rc.6 \
            @deepseek-ai/dsh-timeout@0.1.0-rc.6 \
            @deepseek-ai/dsh-typert-protocol@0.1.0-rc.6 \
            node-addon-require-builtin@0.1.4

      - name: Test against current DSH
        if: matrix.runtime == 'current'
        run: pnpm --filter @memtensor/memos-cloud-dsh-plugin test

      - name: Test against legacy DSH
        if: matrix.runtime == 'legacy-0.1.0-rc.6'
        env:
          DSH_TEST_RUNTIME: ${{ runner.temp }}/dsh-legacy-runtime
        run: pnpm --filter @memtensor/memos-cloud-dsh-plugin test
